function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function daysBetween(a,b){const da=new Date(a+'T00:00:00'),db=new Date(b+'T00:00:00');return Math.round((db-da)/86400000)}

// ===== 打卡辅助 =====
function calcStreak(checkinMap){
  // 计算连续打卡天数(从今天往回数)
  const today=todayKey();
  let streak=0;
  let cur=today;
  // 如果今天没打,从昨天开始算(允许今天还没打)
  if(!checkinMap[today]){
    const d=new Date();d.setDate(d.getDate()-1);cur=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  while(checkinMap[cur]){
    streak++;
    const d=new Date(cur+'T00:00:00');d.setDate(d.getDate()-1);
    cur=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  return streak;
}
function totalCheckinDays(checkinMap){return Object.keys(checkinMap).length}

// ===== 渲染 =====
function renderPlan(){
  const c=document.getElementById('content');
  const tk=todayKey();
  // 统计:运动 + 自定义 + 英语进度(单词8个按掌握数量,场景1个)
  const taskAll=[...state.sport,...state.custom];
  const taskDone=taskAll.filter(i=>i.done).length;
  const wordRec=state.wordCheckin[tk];
  const wordDone=wordRec&&wordRec.known?wordRec.known.length:0;
  const sceneDone=state.sceneCheckin[tk]?1:0;
  const total=taskAll.length+8+1; // 8个单词 + 1个场景
  const done=taskDone+wordDone+sceneDone;
  const pct=total?Math.round(done/total*100):0;

  // 更新顶部 header 进度
  const hpt=document.getElementById('headerProgressText');
  const hpb=document.getElementById('headerProgressBar');
  const hr=document.getElementById('headerRate');
  if(hpt)hpt.textContent=`${done}/${total} 已完成`;
  if(hpb)hpb.style.width=pct+'%';
  if(hr)hr.textContent=`完成率 ${pct}%`;

  let html=`
    <div class="stats">
      <div class="stat"><div class="label">今日任务</div><div class="value">${total}</div></div>
      <div class="stat"><div class="label">已完成</div><div class="value">${done}</div></div>
      <div class="stat"><div class="label">待完成</div><div class="value">${total-done}</div></div>
      <div class="stat"><div class="label">完成率</div><div class="value">${pct}%</div></div>
    </div>
    <div class="progress" style="margin-bottom:12px"><div class="progress-bar" style="background:linear-gradient(90deg,var(--accent),var(--green));width:${pct}%"></div></div>
  `;

  // 减肥运动
  html+=renderGroup('sport','🏃 减肥运动','#e26b6b',state.sport,'运动任务...');
  // 英语学习(打卡模块)
  html+=renderEnglishCheckin();
  // 自定义任务
  html+=renderGroup('custom','📌 我的任务','#b07cf5',state.custom,'自定义任务...');

  c.innerHTML=html;
}

function renderGroup(key,title,color,items,placeholder){
  const done=items.filter(i=>i.done).length;
  const pct=items.length?Math.round(done/items.length*100):0;
  let itemsHtml='';
  if(items.length===0){
    itemsHtml='<div class="empty">还没有内容,点击下方添加</div>';
  }else{
    itemsHtml=items.map(item=>`
      <div class="task-item ${item.done?'done':''}">
        <div class="checkbox ${item.done?'done':''}" data-id="${item.id}" data-key="${key}" role="button" onclick="toggleItem('${item.id}','${key}')" ontouchend="event.preventDefault();toggleItem('${item.id}','${key}')"></div>
        <div class="task-text">${escapeHtml(item.text)}</div>
        ${item.tag?`<span class="task-tag">${escapeHtml(item.tag)}</span>`:''}
        <button class="del-btn" data-del="${item.id}" data-key="${key}" onclick="deleteItem('${item.id}','${key}')" ontouchend="event.preventDefault();deleteItem('${item.id}','${key}')">✕</button>
      </div>
    `).join('');
  }
  return `
    <div class="group">
      <div class="group-head">
        <h2><span class="dot" style="background:${color}"></span>${title}</h2>
        <span class="badge">${done}/${items.length}</span>
      </div>
      <div class="group-body">
        ${itemsHtml}
        <div class="add-row">
          <input type="text" placeholder="${placeholder}" data-input="${key}">
          <select data-dur="${key}"><option value="15分钟">15分</option><option value="30分钟" selected>30分</option><option value="45分钟">45分</option><option value="1小时">1时</option></select>
          <button class="btn" data-add="${key}">添加</button>
        </div>
        <div class="progress"><div class="progress-bar" style="background:${color};width:${pct}%"></div></div>
      </div>
    </div>
  `;
}

// 按日期种子选词/选场景(同一天结果固定,换天自动变)
function dateSeed(dateStr){
  let h=0;
  for(let i=0;i<dateStr.length;i++){h=(h*31+dateStr.charCodeAt(i))>>>0}
  return h;
}
function getTodayWords(dateStr){
  const d=dateStr||todayKey();
  const seed=dateSeed(d);
  // 从词库选8个,按种子轮转
  const start=seed%WORD_BANK.length;
  const result=[];
  for(let i=0;i<8;i++){result.push(WORD_BANK[(start+i)%WORD_BANK.length])}
  return result;
}
function getTodayScene(dateStr){
  const d=dateStr||todayKey();
  const seed=dateSeed(d);
  return SCENE_BANK[seed%SCENE_BANK.length];
}

function renderEnglishCheckin(){
  const tk=todayKey();
  const wordRec=state.wordCheckin[tk];
  const sceneRec=state.sceneCheckin[tk];
  const wordStreak=calcStreak(state.wordCheckin);
  const sceneStreak=calcStreak(state.sceneCheckin);
  const wordTotal=totalCheckinDays(state.wordCheckin);
  const sceneTotal=totalCheckinDays(state.sceneCheckin);
  const todayWords=getTodayWords();
  const todayScene=getTodayScene();

  // 单词打卡区块
  const knownCount=wordRec&&wordRec.known?wordRec.known.length:0;
  let wordHtml=`
    <div class="checkin-block">
      <div class="checkin-top">
        <div class="checkin-title">📖 新概念单词打卡</div>
        ${knownCount>=8?`<span class="checkin-done">✓ 已打卡</span>`:`<span class="checkin-undo">未打卡</span>`}
      </div>
      <div class="checkin-stats">
        <span>🔥 连续 <b>${wordStreak}</b> 天</span>
        <span>累计 <b>${wordTotal}</b> 天</span>
        <span>今日 <b>8</b> 词</span>
      </div>
      <div class="word-list">`;
  todayWords.forEach((wd,i)=>{
    const known=wordRec&&wordRec.known&&wordRec.known.includes(i);
    wordHtml+=`<div class="word-item ${known?'known':''}" data-word-idx="${i}" role="button" onclick="toggleWord(${i})" ontouchend="event.preventDefault();toggleWord(${i})"><div class="word-en">${wd.w}<button class="speak-btn" data-speak="${wd.w}" onclick="event.stopPropagation();speakText(this)" ontouchend="event.stopPropagation();event.preventDefault();speakText(this)">🔊</button><span style="font-size:11px;font-weight:400;color:var(--muted);margin-left:auto">${known?'✓ 已掌握':''}</span></div><div class="word-phonetic">${wd.p}</div><div class="word-cn">${wd.m}</div><div class="word-example">${escapeHtml(wd.e)}<button class="speak-btn" data-speak="${escapeHtml(wd.e)}" onclick="event.stopPropagation();speakText(this)" ontouchend="event.stopPropagation();event.preventDefault();speakText(this)">🔊</button></div><div class="word-example-zh">${escapeHtml(wd.ez)}</div></div>`;
  });
  wordHtml+=`</div>`;
  wordHtml+=`<div class="checkin-result">今日已掌握 <b>${knownCount}</b> / 8 个单词 ${knownCount>=8?'✓':''}</div>`;
  if(knownCount<8){
    wordHtml+=`<div class="checkin-tip">👆 点击单词标记"已掌握"</div>`;
  }
  wordHtml+=`</div>`;

  // 场景化英语打卡区块
  let sceneHtml=`
    <div class="checkin-block">
      <div class="checkin-top">
        <div class="checkin-title">${todayScene.icon} 今日场景:${todayScene.name}</div>
        ${sceneRec?`<span class="checkin-done">✓ 已打卡</span>`:`<span class="checkin-undo">未打卡</span>`}
      </div>
      <div class="checkin-stats">
        <span>🔥 连续 <b>${sceneStreak}</b> 天</span>
        <span>累计 <b>${sceneTotal}</b> 天</span>
      </div>
      <div class="scene-tip">📌 每日自动更换场景,熟读以下5个核心句型后打卡</div>
      <div class="sentence-list">`;
  todayScene.sentences.forEach((s,i)=>{
    sceneHtml+=`<div class="sentence-item"><div class="sent-num">${i+1}</div><div class="sent-content"><div class="sent-en">${escapeHtml(s.en)}<button class="speak-btn" data-speak="${escapeHtml(s.en)}" ontouchend="event.preventDefault();speakText(this)">🔊</button></div><div class="sent-zh">${escapeHtml(s.zh)}</div></div></div>`;
  });
  sceneHtml+=`</div>`;
  if(sceneRec){
    sceneHtml+=`<div class="checkin-result">已完成「${escapeHtml(todayScene.name)}」场景练习 <b>${sceneRec.minutes}</b>分钟 ✓</div>`;
  }else{
    sceneHtml+=`<div class="checkin-input-row" style="margin-top:8px">
      <select id="sceneMin"><option value="10">10分</option><option value="15" selected>15分</option><option value="20">20分</option><option value="30">30分</option></select>
      <button class="btn checkin-btn" onclick="doSceneCheckin()">完成打卡</button>
    </div>`;
  }
  sceneHtml+=`</div>`;

  // 历史(最近7天)
  const allDates=[...new Set([...Object.keys(state.wordCheckin),...Object.keys(state.sceneCheckin)])].sort().reverse().slice(0,7);
  let histHtml='';
  if(allDates.length){
    histHtml='<div class="checkin-hist-title">📋 最近打卡记录</div>';
    allDates.forEach(d=>{
      const w=state.wordCheckin[d],s=state.sceneCheckin[d];
      let parts=[];
      if(w)parts.push(`单词 ${w.known?w.known.length:0}/8`);
      if(s)parts.push(`${s.sceneName||s.scene} ${s.minutes}分`);
      histHtml+=`<div class="checkin-hist-item"><span class="ch-date">${d}</span><span class="ch-detail">${parts.join(' · ')||'—'}</span></div>`;
    });
  }

  const done=(wordRec?1:0)+(sceneRec?1:0);
  return `
    <div class="group">
      <div class="group-head">
        <h2><span class="dot" style="background:#5b9bf5"></span>📚 英语学习打卡</h2>
        <span class="badge">${done}/2</span>
      </div>
      <div class="group-body">
        ${wordHtml}
        ${sceneHtml}
        ${histHtml}
      </div>
    </div>
  `;
}

// 点击单词标记掌握(单独保存)
function toggleWord(idx){
  const tk=todayKey();
  if(!state.wordCheckin[tk])state.wordCheckin[tk]={known:[],ts:Date.now()};
  const known=state.wordCheckin[tk].known;
  const pos=known.indexOf(idx);
  if(pos>=0)known.splice(pos,1);else known.push(idx);
  state.wordCheckin[tk].ts=Date.now();
  saveState();renderPlan();
}

// 朗读单词/句子
function speak(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=0.85;u.pitch=1;
  window.speechSynthesis.speak(u);
}
// 从 data-speak 属性读取文本并朗读(避免引号冲突)
function speakText(el){
  const text=el.getAttribute('data-speak')||'';
  if(!text)return;
  // 反转义 HTML 实体
  const tmp=document.createElement('div');
  tmp.innerHTML=text;
  speak(tmp.textContent||tmp.innerText||'');
}

function doWordCheckin(){
  const tk=todayKey();
  if(!state.wordCheckin[tk])state.wordCheckin[tk]={known:[],ts:Date.now()};
  saveState();renderPlan();
}
function doSceneCheckin(){
  const minutes=parseInt(document.getElementById('sceneMin').value);
  const tk=todayKey();
  const sc=getTodayScene();
  state.sceneCheckin[tk]={scene:sc.name,sceneName:sc.name,minutes,ts:Date.now()};
  saveState();renderPlan();
}

    html+=`
      <a class="link-card" href="${n.url}" target="_blank" rel="noopener">
        <div class="link-icon" style="background:var(--orange)22;color:var(--orange)">📰</div>
        <div class="link-info">
          <div class="link-title">${escapeHtml(n.title)}</div>
          <div class="link-desc">${escapeHtml(n.desc)}</div>
          <div class="link-meta"><span class="link-source">${escapeHtml(n.source)}</span></div>
        </div>
        <div class="link-arrow">›</div>
      </a>
    `;
  });
  c.innerHTML=html;
}

function renderReview(){
  const c=document.getElementById('content');
  let itemsHtml='';
  if(state.review.length===0){
    itemsHtml='<div class="empty">还没有复盘记录,在上方写下今天的复盘</div>';
  }else{
    itemsHtml=state.review.slice().reverse().map(r=>{
      const d=new Date(r.ts);
      const ds=`${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      return `<div class="review-item"><div class="r-text">${escapeHtml(r.text)}</div><div class="r-meta">${ds}</div></div>`;
    }).join('');
  }
  c.innerHTML=`
    <div class="review-box">
      <textarea id="reviewInput" placeholder="写下今天的复盘:完成了什么?学到了什么?明天怎么改进?"></textarea>
      <div style="margin-top:8px;text-align:right"><button class="btn" onclick="addReview()">保存复盘</button></div>
    </div>
    <div style="font-size:13px;color:var(--muted);padding:8px 4px;font-weight:600">📋 历史复盘</div>
    ${itemsHtml}
  `;
}

function addReview(){
  const input=document.getElementById('reviewInput');
  const text=input.value.trim();
  if(!text)return;
  state.review.push({id:uid(),text,ts:Date.now()});
  input.value='';
  saveState();
  renderReview();
}

// ===== 每月复盘(打卡日历) =====
let calYear,calMonth;
function renderMonthly(){
  const c=document.getElementById('content');
  const today=new Date();
  if(calYear===undefined){calYear=today.getFullYear();calMonth=today.getMonth()}
  // 合并所有打卡日期,计算每天的打卡等级(0-5)
  const dayLevel={};
  // 单词打卡:+2
  Object.keys(state.wordCheckin).forEach(d=>{
    dayLevel[d]=(dayLevel[d]||0)+2;
  });
  // 场景打卡:+1
  Object.keys(state.sceneCheckin).forEach(d=>{
    dayLevel[d]=(dayLevel[d]||0)+1;
  });
  // 运动+自定义任务完成的日期(用任务done状态无法关联日期,跳过;用打卡为准)
  // 等级封顶5
  Object.keys(dayLevel).forEach(d=>{dayLevel[d]=Math.min(5,dayLevel[d])});

  // 日历
  const firstDay=new Date(calYear,calMonth,1);
  const lastDay=new Date(calYear,calMonth+1,0);
  const daysInMonth=lastDay.getDate();
  // 周一=0 ... 周日=6
  let firstWeekday=firstDay.getDay()-1;
  if(firstWeekday<0)firstWeekday=6;
  const tk=todayKey();
  const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  let daysHtml='';
  // 前置空位
  for(let i=0;i<firstWeekday;i++){daysHtml+='<div class="cal-day other"></div>'}
  // 日期格
  for(let d=1;d<=daysInMonth;d++){
    const dKey=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const lv=dayLevel[dKey]||0;
    const isToday=(dKey===tk);
    daysHtml+=`<div class="cal-day lv${lv} ${isToday?'today':''}" data-date="${dKey}" role="button" onclick="showDayDetail('${dKey}')" ontouchend="event.preventDefault();showDayDetail('${dKey}')"><div class="d-num">${d}</div><div class="d-dot"></div></div>`;
  }

  // 本月打卡统计
  let monthDays=0,monthFull=0;
  Object.keys(dayLevel).forEach(d=>{
    if(d.startsWith(`${calYear}-${String(calMonth+1).padStart(2,'0')}`)){
      monthDays++;
      if(dayLevel[d]>=3)monthFull++;
    }
  });

  // 月份复盘文字
  const monthKey=`${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  if(!state.monthlyReview)state.monthlyReview={};
  const reviewText=state.monthlyReview[monthKey]||'';

  c.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="label">本月打卡</div><div class="value">${monthDays}</div></div>
      <div class="stat"><div class="label">满级天数</div><div class="value">${monthFull}</div></div>
      <div class="stat"><div class="label">累计打卡</div><div class="value">${Object.keys(dayLevel).length}</div></div>
      <div class="stat"><div class="label">单词连续</div><div class="value">${calcStreak(state.wordCheckin)}</div></div>
    </div>
    <div class="calendar-card">
      <div class="calendar-header">
        <button class="calendar-btn" onclick="changeMonth(-1)" ontouchend="event.preventDefault();changeMonth(-1)">‹</button>
        <h2>${calYear}年 ${monthNames[calMonth]}</h2>
        <button class="calendar-btn" onclick="changeMonth(1)" ontouchend="event.preventDefault();changeMonth(1)">›</button>
      </div>
      <div class="calendar-weekdays">
        <div class="weekday">一</div><div class="weekday">二</div><div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday">六</div><div class="weekday">日</div>
      </div>
      <div class="calendar-days">${daysHtml}</div>
      <div class="cal-legend">
        <span>少</span>
        <div class="cal-legend-box">
          <span style="background:var(--panel2)"></span>
          <span style="background:#b07cf522"></span>
          <span style="background:#b07cf544"></span>
          <span style="background:#b07cf577"></span>
          <span style="background:#b07cf5aa"></span>
          <span style="background:#b07cf5"></span>
        </div>
        <span>多</span>
      </div>
    </div>
    <div class="month-detail">
      <h3>📝 ${calYear}年${monthNames[calMonth]}月总结</h3>
      <textarea id="monthReviewInput" placeholder="这个月做得好的地方、需要改进的地方、下月计划...">${escapeHtml(reviewText)}</textarea>
      <div class="save-row">
        <span>点击日期格可手动标记/取消打卡</span>
        <button onclick="saveMonthReview('${monthKey}')" ontouchend="event.preventDefault();saveMonthReview('${monthKey}')">保存</button>
      </div>
    </div>
    <div style="font-size:12px;color:var(--muted);padding:12px 4px;line-height:1.6">
      💡 打卡等级说明:单词打卡+2,场景英语+1,满级5。<br>
      颜色越深表示当日打卡越完整。点击任意日期可手动补卡或取消。
    </div>
  `;
}

function changeMonth(delta){
  calMonth+=delta;
  if(calMonth<0){calMonth=11;calYear--}
  if(calMonth>11){calMonth=0;calYear++}
  renderMonthly();
}

function showDayDetail(dateKey){
  const tk=todayKey();
  const wc=state.wordCheckin[dateKey];
  const sc=state.sceneCheckin[dateKey];
  const d=new Date(dateKey+'T00:00:00');
  const weekNames=['周日','周一','周二','周三','周四','周五','周六'];
  const dateLabel=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${weekNames[d.getDay()]}`;
  const isToday=(dateKey===tk);
  const words=getTodayWords(dateKey);
  const knownIdx=wc&&wc.known?wc.known:[];

  // 场景英语
  let sceneDetail='未打卡';
  if(sc){
    sceneDetail=`${sc.sceneName||sc.scene} · ${sc.minutes||0}分钟 ✓`;
  }

  // 单词列表(8个全显示,掌握的打勾)
  let wordsHtml=words.map((wd,i)=>{
    const known=knownIdx.includes(i);
    return `<div class="dd-word-row ${known?'dd-known':''}" data-dk="${dateKey}" data-wi="${i}" role="button" onclick="toggleDetailWord('${dateKey}',${i})" ontouchend="event.preventDefault();toggleDetailWord('${dateKey}',${i})">
      <span class="dd-w-check">${known?'✅':'⬜'}</span>
      <div class="dd-w-info">
        <div class="dd-w-en">${wd.w} <span class="dd-w-ph">${wd.p}</span></div>
        <div class="dd-w-cn">${wd.m}</div>
        <div class="dd-w-eg">${escapeHtml(wd.e)}</div>
      </div>
    </div>`;
  }).join('');

  const knownCount=knownIdx.length;

  // 构建详情 HTML
  const overlay=document.createElement('div');
  overlay.className='day-detail-overlay';
  overlay.onclick=function(e){if(e.target===overlay)closeDetail()}
  overlay.innerHTML=`
    <div class="day-detail-panel">
      <h3>📅 ${dateLabel}</h3>
      <div class="dd-sub">${isToday?'今天':'历史记录'} · 单词 ${knownCount}/8 · 场景${sc?'已打卡':'未打卡'}</div>
      <div class="dd-section">
        <div class="dd-label">📖 单词打卡（${knownCount}/8）</div>
        <div class="dd-words-list">${wordsHtml}</div>
        ${knownCount<8?`<div style="margin-top:6px"><button class="btn" style="background:var(--green);color:#fff;font-size:12px;padding:6px 14px" onclick="markAllWords('${dateKey}')" ontouchend="event.preventDefault();markAllWords('${dateKey}')">全部标记已掌握</button></div>`:''}
      </div>
      <div class="dd-section">
        <div class="dd-label">🎭 场景英语</div>
        <div class="dd-value">${sceneDetail}</div>
        ${!sc?`<div style="margin-top:4px"><button class="btn" style="background:var(--accent);color:#fff;font-size:12px;padding:6px 14px" onclick="supplementScene('${dateKey}')" ontouchend="event.preventDefault();supplementScene('${dateKey}')">补场景打卡</button></div>`:''}
      </div>
      <div class="dd-actions">
        <button class="dd-btn-close" onclick="closeDetail()">关闭</button>
        ${wc||sc?`<button class="dd-btn-cancel" onclick="cancelDayCheckin('${dateKey}')">清除全部</button>`:`<button class="dd-btn-supplement" onclick="supplementDay('${dateKey}')">一键补卡</button>`}
      </div>
    </div>
  `;
  document.body.classList.add('noscroll');
  document.body.appendChild(overlay);
}
function toggleDetailWord(dateKey,idx){
  if(!state.wordCheckin[dateKey])state.wordCheckin[dateKey]={known:[],ts:Date.now()};
  const known=state.wordCheckin[dateKey].known;
  const pos=known.indexOf(idx);
  if(pos>=0)known.splice(pos,1);else known.push(idx);
  state.wordCheckin[dateKey].ts=Date.now();
  saveState();
  // 刷新弹窗
  closeDetail();
  showDayDetail(dateKey);
}

// 全部标记已掌握
function markAllWords(dateKey){
  if(!state.wordCheckin[dateKey])state.wordCheckin[dateKey]={known:[],ts:Date.now()};
  state.wordCheckin[dateKey].known=[0,1,2,3,4,5,6,7];
  state.wordCheckin[dateKey].ts=Date.now();
  saveState();
  closeDetail();
  showDayDetail(dateKey);
}

// 单独补场景打卡
function supplementScene(dateKey){
  const sc=getTodayScene(dateKey);
  state.sceneCheckin[dateKey]={scene:sc.name,sceneName:sc.name,minutes:15,ts:Date.now()};
  saveState();
  closeDetail();
  showDayDetail(dateKey);
}

// 关闭详情弹窗并恢复滚动
function closeDetail(){
  document.querySelector('.day-detail-overlay')?.remove();
  document.body.classList.remove('noscroll');
}

function supplementDay(dateKey){
  state.wordCheckin[dateKey]={known:[0,1,2,3,4,5,6,7],ts:Date.now()};
  state.sceneCheckin[dateKey]={scene:'补卡',sceneName:'补卡',minutes:15,ts:Date.now()};
  saveState();
  closeDetail();
  renderMonthly();
}

function cancelDayCheckin(dateKey){
  delete state.wordCheckin[dateKey];
  delete state.sceneCheckin[dateKey];
  saveState();
  closeDetail();
  renderMonthly();
}

// 兼容旧的 toggleDayCheckin
function toggleDayCheckin(dateKey){
  const tk=todayKey();
  if(dateKey===tk){
    alert('今天的打卡请在「每日计划」页面完成哦~');
    return;
  }
  showDayDetail(dateKey);
}

function saveMonthReview(monthKey){
  const ta=document.getElementById('monthReviewInput');
  if(!state.monthlyReview)state.monthlyReview={};
  state.monthlyReview[monthKey]=ta.value;
  saveState();
  // 简单反馈
  const btn=ta.nextElementSibling.querySelector('button');
  if(btn){const o=btn.textContent;btn.textContent='已保存 ✓';setTimeout(()=>btn.textContent=o,1200)}
}


function addItem(key){
  const input=document.querySelector(`[data-input="${key}"]`);
  const sel=document.querySelector(`[data-dur="${key}"]`);
  const text=input.value.trim();
  if(!text)return;
  state[key].push({id:uid(),text,tag:sel?sel.value:'30分钟',done:false});
  input.value='';
  saveState();
  renderPlan();
}

// ===== 重置今日(清除今日打卡 + 运动任务勾选) =====
function resetToday(){
  if(!confirm('确定要重置今日所有打卡和任务完成状态吗?'))return;
  const tk=todayKey();
  // 重置运动和自定义任务的勾选
  state.sport.forEach(i=>i.done=false);
  state.custom.forEach(i=>i.done=false);
  // 删除今日打卡记录
  delete state.wordCheckin[tk];
  delete state.sceneCheckin[tk];
  saveState();renderPlan();
}

// ===== 导航切换 =====
let currentPage='plan';
function switchPage(page){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  if(page==='plan')renderPlan();
  else if(page==='podcast')renderPodcast();
  else if(page==='news')renderNews();
  else if(page==='review')renderReview();
  else if(page==='monthly')renderMonthly();
}

document.getElementById('sidebar').addEventListener('click',e=>{
  const nav=e.target.closest('.nav-item');
  if(nav)switchPage(nav.dataset.page);
});

// 勾选/取消完成(内联调用,确保手机端可靠)
function toggleItem(id,key){
  const item=state[key].find(i=>i.id===id);
  if(item)item.done=!item.done;
  saveState();renderPlan();
}

// 删除任务(内联调用,确保手机端可靠)
function deleteItem(id,key){
  state[key]=state[key].filter(i=>i.id!==id);
  saveState();renderPlan();
}

// 点击/删除事件委托(备用)
document.addEventListener('click',e=>{
  const cb=e.target.closest('.checkbox');
  if(cb){
    const item=state[cb.dataset.key].find(i=>i.id===cb.dataset.id);
    if(item)item.done=!item.done;
    saveState();renderPlan();return;
  }
  const del=e.target.closest('[data-del]');
  if(del){
    state[del.dataset.key]=state[del.dataset.key].filter(i=>i.id!==del.dataset.id);
    saveState();renderPlan();return;
  }
  const addBtn=e.target.closest('[data-add]');
  if(addBtn){addItem(addBtn.dataset.add);return}
});

// 回车提交
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.input){
    addItem(e.target.dataset.input);
    e.target.blur();
  }
});

// 日期
const now=new Date();
const wk=['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
document.getElementById('todayStr').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · ${wk}`;

// 安装提示
if(!window.matchMedia('(display-mode: standalone)').matches&&!window.navigator.standalone&&!localStorage.getItem('hintShown')){
  setTimeout(()=>{document.getElementById('installHint').classList.add('show');localStorage.setItem('hintShown','1')},1500);
}

// 初始渲染
switchPage('plan');
</script>
</body>
</html>
